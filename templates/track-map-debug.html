<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Debug Pista - Mappa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b1020;
      color: #e5e7eb;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    .legend {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 1000;
    }
    .legend div {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 2px 0;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .line {
      width: 18px;
      height: 3px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="legend">
    <div><span class="dot" style="background:#ef4444"></span> Start/Finish</div>
    <div><span class="line" style="background:#ef4444"></span> Linea traguardo</div>
    <div><span class="line" style="background:#3b82f6"></span> Settore 1</div>
    <div><span class="line" style="background:#22c55e"></span> Settore 2</div>
    <div><span class="line" style="background:#f59e0b"></span> Settore 3</div>
    <div><span class="dot" style="background:#a855f7"></span> Posizione live</div>
    <div><span class="line" style="background:#a855f7"></span> Traccia ultimi 30s</div>
    <div><span class="line" style="background:#6b7280"></span> Pit lane / Box</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const trackConfig = {{ track_config | tojson }};

    const map = L.map("map", { preferCanvas: true });

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap",
    }).addTo(map);

    const sf = trackConfig.track.start_finish || {};
    const centerLat = sf.latitude || 41.2737;
    const centerLon = sf.longitude || 13.1554;

    map.setView([centerLat, centerLon], 17);

    // Marker start/finish
    if (sf.latitude && sf.longitude) {
      L.marker([sf.latitude, sf.longitude])
        .addTo(map)
        .bindPopup("<b>Start/Finish</b><br>Linea di traguardo");
    }

    function drawHeadingLine(lat, lon, headingDeg, lengthM, color, weight) {
      const headingRad = (headingDeg - 90) * Math.PI / 180;
      const R = 6371000;
      const dLat = (Math.cos(headingRad) * lengthM) / R;
      const dLon = (Math.sin(headingRad) * lengthM) / (R * Math.cos(lat * Math.PI / 180));
      const lat2 = lat + (dLat * 180 / Math.PI);
      const lon2 = lon + (dLon * 180 / Math.PI);

      L.polyline([[lat, lon], [lat2, lon2]], {
        color: color,
        weight: weight,
        opacity: 0.9,
      }).addTo(map);
    }

    // Traguardo
    if (sf.latitude && sf.longitude) {
      const sfHeading = sf.heading_deg ?? 90;
      drawHeadingLine(sf.latitude, sf.longitude, sfHeading, 15, "#ef4444", 4);
    }

    // Settori
    const sectors = trackConfig.track.sectors || [];
    const sectorColors = ["#3b82f6", "#22c55e", "#f59e0b"];

    sectors.forEach((sec, i) => {
      const color = sectorColors[i % 3];
      const heading = sec.heading_deg ?? 90;
      if (sec.latitude && sec.longitude) {
        drawHeadingLine(sec.latitude, sec.longitude, heading, 12, color, 3);
        L.marker([sec.latitude, sec.longitude])
          .addTo(map)
          .bindPopup("<b>Settore " + (i + 1) + "</b>");
      }
    });

    // Pit lane / Box
    const pit = trackConfig.track.pit_lane;
    if (pit && pit.polygon && pit.polygon.length > 2) {
      const polyCoords = pit.polygon.map(p => [p.latitude, p.longitude]);
      L.polygon(polyCoords, {
        color: "#6b7280",
        weight: 2,
        fill: true,
        fillColor: "rgba(107,114,128,0.2)",
      }).addTo(map);
    } else if (pit && pit.center_latitude && pit.center_longitude) {
      const radius = pit.radius_m || 20;
      L.circle([pit.center_latitude, pit.center_longitude], {
        radius: radius,
        color: "#6b7280",
        weight: 2,
        fill: true,
        fillColor: "rgba(107,114,128,0.2)",
      }).addTo(map);
    }

    // Live GPS
    let liveMarker = null;
    let liveLine = null;
    let liveHistory = [];

    function updateLivePosition(gps) {
      if (!gps || !gps.fix_valid || !gps.latitude || !gps.longitude) return;

      const lat = gps.latitude;
      const lon = gps.longitude;

      if (!liveMarker) {
        liveMarker = L.marker([lat, lon]).addTo(map)
          .bindPopup("<b>Posizione live</b>");
      } else {
        liveMarker.setLatLng([lat, lon]);
      }

      liveHistory.push([lat, lon]);
      if (liveHistory.length > 300) liveHistory.shift();

      if (!liveLine) {
        liveLine = L.polyline(liveHistory, {
          color: "#a855f7",
          weight: 3,
          opacity: 0.8,
        }).addTo(map);
      } else {
        liveLine.setLatLngs(liveHistory);
      }

      map.panTo([lat, lon], { animate: true, duration: 0.3 });
    }

    async function pollLive() {
      try {
        const res = await fetch("/api/live");
        if (!res.ok) return;
        const data = await res.json();
        updateLivePosition(data.gps);
      } catch (e) {
        console.error("Errore fetch live:", e);
      }
      setTimeout(pollLive, 200);
    }

    pollLive();
  </script>
</body>
</html>
